<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Verifica tu identidad — Elección de Rey y Reina</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="text-white min-h-screen flex items-center justify-center px-6 py-10 no-x-scroll">

  <div class="w-full max-w-md step-panel">
    <div id="verify-stepper" class="mb-8"></div>

    <div class="text-center mb-8">
      <div class="text-4xl mb-2">🪪</div>
      <h1 class="font-display text-3xl font-bold">Verifica tu identidad</h1>
      <p class="text-gray-400 mt-2 text-sm">Usa tu correo institucional y número de control.</p>
    </div>

    <form id="verify-form" class="bg-[var(--bg-card)] border border-white/10 rounded-2xl p-8 space-y-5">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5" for="email">Correo institucional</label>
        <input id="email" type="email" required placeholder="alumno@escuela.edu.mx"
               class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:gold-border transition-colors">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5" for="control">Número de control</label>
        <input id="control" type="text" required placeholder="12345678"
               class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:gold-border transition-colors">
      </div>

      <div id="error-box" class="hidden text-sm text-red-400 bg-red-950/40 border border-red-900 rounded-xl px-4 py-3"></div>

      <button type="submit" id="submit-btn" class="btn-gold w-full py-3.5 rounded-xl text-base">
        CONTINUAR
      </button>
    </form>

    <p class="text-center text-gray-600 text-xs mt-6">
      <a href="/" class="hover:text-gray-400">← Volver al inicio</a>
    </p>
  </div>

<script src="/js/security-guard.js"></script>
<script src="/js/config.js"></script>
<script src="/js/stepper.js"></script>
<script>renderStepper(document.getElementById("verify-stepper"), "verify");</script>
<script src="/js/verify.js"></script>
</body>
</html>
